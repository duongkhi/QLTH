[theme]
# Khóa giao diện cố định để không bị thay đổi tùy máy khách (light/dark tự động của trình duyệt)
base = "light"
primaryColor = "#1a73e8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8f9fa"
textColor = "#212529"
font = "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"

[server]
# Tắt chế độ tự động theme theo hệ điều hành
enableXsrfProtection = true

[browser]
gatherUsageStats = false
